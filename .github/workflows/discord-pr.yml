name: Notify Discord on Push and Pull Request

on:
  push:
    branches: [main, dev]           # ← main·dev 브랜치에 커밋 올 때
  pull_request:
    types: [opened, closed, reopened]
    branches: [main, dev]           # ← main·dev 대상으로 PR 열릴 때

jobs:
  discord-notify:
    runs-on: ubuntu-latest

    # ✅ 한 번만 선언 – 두 값 모두 필요
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      GITHUB_EVENT: ${{ toJson(github.event) }}

    steps:
      - name: Send Discord notification
        shell: bash
        run: |
          EVENT_NAME="${{ github.event_name }}"

          ###############################################################
          # 1) push 알림 – 여러 커밋 목록을 PR 스타일로 예쁘게 전송
          ###############################################################
          if [ "$EVENT_NAME" = "push" ]; then
            python3 - <<'PY'
import os, json, datetime, urllib.request, sys, html

evt      = json.loads(os.environ['GITHUB_EVENT'])
commits  = evt.get("commits", [])
pusher   = evt.get("pusher", {}).get("name", "알 수 없음")
branch   = os.getenv("GITHUB_REF", "").replace("refs/heads/", "")
repo     = os.getenv("GITHUB_REPOSITORY", "")
after    = evt.get("after")
commit_url = f"https://github.com/{repo}/commit/{after}"

# ── 커밋 메시지 10개까지만 정리
lines = "\n".join(f"• `{html.escape(c.get('message','').splitlines()[0])}`" for c in commits[:10])
if len(commits) > 10:
    lines += f"\n…외 {len(commits)-10}개 커밋 더 있음"

payload = {
  "username": "GitHub Bot",
  "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
  "embeds": [{
      "title": f"📦 커밋 푸시 알림: `{branch}` 브랜치",
      "description": (
          f"👤 푸시한 사람: **{html.escape(pusher)}**\n\n"
          f"**커밋 목록:**\n{lines}\n"
          f"총 {len(commits)}개 커밋이 푸시되었습니다.\n"
          f"[🔗 커밋 보기]({commit_url})"
      ),
      "color": 3447003,
      "footer": {"text": "GitHub Actions - Push 알림"},
      "timestamp": datetime.datetime.utcnow().isoformat() + "Z"
  }]
}

hook = os.getenv("DISCORD_WEBHOOK")
if not hook:
    sys.exit("❌ DISCORD_WEBHOOK not set")
req = urllib.request.Request(hook,
        data=json.dumps(payload).encode(),
        headers={"Content-Type": "application/json"})
with urllib.request.urlopen(req) as r:
    print("✅ Discord push notify:", r.status)
PY

          ###############################################################
          # 2) pull_request 알림 – opened / closed / reopened
          ###############################################################
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            python3 - <<'PY'
import os, json, datetime, urllib.request, sys, html, re

evt = json.loads(os.environ['GITHUB_EVENT'])
pr = evt.get("pull_request", {})
action = evt.get("action", "")

pr_title = pr.get("title", "")
pr_user = pr.get("user", {}).get("login", "")
pr_url = pr.get("html_url", "")
pr_body = pr.get("body", "") or "(내용 없음)"
pr_head = pr.get("head", {}).get("ref", "")
pr_base = pr.get("base", {}).get("ref", "")
pr_files = pr.get("changed_files", 0)
pr_commits = pr.get("commits", 0)
pr_merged = pr.get("merged", False)

# 상태 문구
if action == "opened":
    status = "🔔 새 PR이 열렸습니다!"
elif action == "reopened":
    status = "♻️ PR이 다시 열렸습니다!"
elif action == "closed":
    if pr_merged:
        status = "✅ PR이 병합되었습니다!"
    else:
        status = "❌ PR이 닫혔습니다!"
else:
    status = f"ℹ️ PR 이벤트: {action}"

# PR 내용 이스케이프 처리 및 길이 제한
max_body_length = 1500
if len(pr_body) > max_body_length:
    pr_body = pr_body[:max_body_length] + "... (더 보려면 PR 링크 클릭)"

# Discord 마크다운 문법에서 문제 일으킬 수 있는 문자 처리
pr_body = pr_body.replace('`', '\'')
pr_body = re.sub(r'(\[|\]|\(|\))', r'\\\1', pr_body)

payload = {
  "username": "GitHub Bot",
  "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
  "embeds": [{
      "title": f"📌 PR 제목: {html.escape(pr_title)}",
      "url": pr_url,
      "description": f"{status}\n👤 작성자: [{html.escape(pr_user)}](https://github.com/{pr_user})",
      "color": 5814783,
      "fields": [
          {"name": "📂 브랜치", "value": f"`{html.escape(pr_head)}` → `{html.escape(pr_base)}`", "inline": True},
          {"name": "🧾 변경된 파일 수", "value": f"{pr_files}개", "inline": True},
          {"name": "📝 커밋 수", "value": f"{pr_commits}개", "inline": True},
          {"name": "💬 PR 내용", "value": pr_body}
      ],
      "footer": {"text": "GitHub Actions - Pull Request 알림"},
      "timestamp": datetime.datetime.utcnow().isoformat() + "Z"
  }]
}

hook = os.getenv("DISCORD_WEBHOOK")
if not hook:
    sys.exit("❌ DISCORD_WEBHOOK not set")
req = urllib.request.Request(hook,
        data=json.dumps(payload).encode(),
        headers={"Content-Type": "application/json"})
with urllib.request.urlopen(req) as r:
    print(f"✅ Discord PR notify ({action}):", r.status)
PY
          fi