name: Notify Discord on Pull Request

on:
  pull_request:
    types: [opened, closed, reopened]
    branches:
      - dev

jobs:
  discord-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send PR info to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_USER="${{ github.event.pull_request.user.login }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_STATE="${{ github.event.action }}"

          case "$PR_STATE" in
            opened)
              STATUS="🔔 새 PR이 열렸어요!"
              ;;
            closed)
              if ${{ github.event.pull_request.merged }}; then
                STATUS="✅ PR이 병합되었어요!"
              else
                STATUS="❌ PR이 닫혔어요!"
              fi
              ;;
            reopened)
              STATUS="♻️ PR이 다시 열렸어요!"
              ;;
            *)
              STATUS="ℹ️ PR 이벤트: $PR_STATE"
              ;;
          esac

          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{
            \"username\": \"GitHub Bot\",
            \"avatar_url\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\",
            \"embeds\": [{
              \"title\": \"${PR_TITLE}\",
              \"url\": \"${PR_URL}\",
              \"description\": \"${STATUS}\",
              \"color\": 5814783,
              \"author\": {
                \"name\": \"${PR_USER}\",
                \"url\": \"https://github.com/${PR_USER}\"
              },
              \"footer\": {
                \"text\": \"GitHub Actions PR 알림\"
              },
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" $DISCORD_WEBHOOK
