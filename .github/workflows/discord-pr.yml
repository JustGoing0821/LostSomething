name: Minimal Discord Notification

on:
  # 수동으로 실행할 수 있게 workflow_dispatch 추가
  workflow_dispatch:
  push:
    branches: [main, dev]

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Echo webhook status
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK }}" ]; then
            echo "✅ DISCORD_WEBHOOK is set"
          else
            echo "❌ DISCORD_WEBHOOK is NOT set"
            exit 1
          fi
      
      - name: Send Discord message
        run: |
          curl -v -X POST \
            -H "Content-Type: application/json" \
            -d '{"content": "GitHub Action에서 보낸 테스트 메시지입니다."}' \
            ${{ secrets.DISCORD_WEBHOOK }}