name: Discord Notification

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, closed, reopened]
    branches: [main, dev]

jobs:
  discord-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Push notification
        if: github.event_name == 'push'
        run: |
          BRANCH="${{ github.ref_name }}"
          AUTHOR="${{ github.event.pusher.name }}"
          MESSAGE="🏷️ [커밋 푸시] $BRANCH 브랜치 - 👤 $AUTHOR"
          
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"GitHub Bot\",\"avatar_url\":\"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\",\"content\":\"$MESSAGE\"}" \
            ${{ secrets.DISCORD_WEBHOOK }}
      
      - name: PR notification
        if: github.event_name == 'pull_request'
        run: |
          PR_ACTION="${{ github.event.action }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_USER="${{ github.event.pull_request.user.login }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          
          # 제목에 특수문자가 있을 경우 대비
          PR_TITLE=$(echo "$PR_TITLE" | sed 's/"/\\"/g' | sed "s/'/\\'/g")
          
          # PR 상태 설정
          if [ "$PR_ACTION" = "opened" ]; then
            STATUS="⚠️ 새 PR이 열렸어요!"
          elif [ "$PR_ACTION" = "reopened" ]; then
            STATUS="⚠️ PR이 다시 열렸어요!"
          elif [ "$PR_ACTION" = "closed" ]; then
            if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
              STATUS="✅ PR이 병합되었어요!"
            else
              STATUS="❌ PR이 닫혔어요!"
            fi
          else
            STATUS="ℹ️ PR 이벤트: $PR_ACTION"
          fi
          
          MESSAGE="$PR_USER 님의 PR: #$PR_NUMBER $PR_TITLE
$STATUS"
          
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"GitHub Bot\",\"avatar_url\":\"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\",\"content\":\"$MESSAGE\"}" \
            ${{ secrets.DISCORD_WEBHOOK }}