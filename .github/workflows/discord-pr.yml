name: Notify Discord on Push and Pull Request

on:
  push:
    branches: [main, dev]           # ← main·dev 브랜치에 커밋 올 때
  pull_request:
    types: [opened, closed, reopened]
    branches: [main, dev]           # ← main·dev 대상으로 PR 열릴 때

jobs:
  discord-notify:
    runs-on: ubuntu-latest

    # ✅ 한 번만 선언 – 두 값 모두 필요
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      GITHUB_EVENT:   ${{ toJson(github.event) }}

    steps:
      - name: Send Discord notification
        shell: bash
        run: |
          EVENT_NAME="${{ github.event_name }}"

          ###############################################################
          # 1) push 알림 – 여러 커밋 목록을 PR 스타일로 예쁘게 전송
          ###############################################################
          if [ "$EVENT_NAME" = "push" ]; then
            python3 - <<'PY'
import os, json, datetime, urllib.request, sys

evt      = json.loads(os.environ['GITHUB_EVENT'])
commits  = evt.get("commits", [])
pusher   = evt.get("pusher", {}).get("name", "알 수 없음")
branch   = os.getenv("GITHUB_REF", "").replace("refs/heads/", "")
repo     = os.getenv("GITHUB_REPOSITORY", "")
after    = evt.get("after")
commit_url = f"https://github.com/{repo}/commit/{after}"

# ── 커밋 메시지 10개까지만 정리
lines = "\n".join(f"• `{c.get('message','').splitlines()[0]}`" for c in commits[:10])
if len(commits) > 10:
    lines += f"\n…외 {len(commits)-10}개 커밋 더 있음"

payload = {
  "username": "GitHub Bot",
  "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
  "embeds": [{
      "title": f"📦 커밋 푸시 알림: `{branch}` 브랜치",
      "description": (
          f"👤 푸시한 사람: **{pusher}**\n\n"
          f"**커밋 목록:**\n{lines}\n"
          f"총 {len(commits)}개 커밋이 푸시되었습니다.\n"
          f"[🔗 커밋 보기]({commit_url})"
      ),
      "color": 3447003,
      "footer": {"text": "GitHub Actions - Push 알림"},
      "timestamp": datetime.datetime.utcnow().isoformat() + "Z"
  }]
}

hook = os.getenv("DISCORD_WEBHOOK")
if not hook:
    sys.exit("❌ DISCORD_WEBHOOK not set")
req = urllib.request.Request(hook,
        data=json.dumps(payload).encode(),
        headers={"Content-Type": "application/json"})
with urllib.request.urlopen(req) as r:
    print("✅ Discord push notify:", r.status)
PY

          ###############################################################
          # 2) pull_request 알림 – opened / closed / reopened
          ###############################################################
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            PR_TITLE="${{ github.event.pull_request.title }}"
            PR_USER="${{ github.event.pull_request.user.login }}"
            PR_URL="${{ github.event.pull_request.html_url }}"
            PR_STATE="${{ github.event.action }}"
            PR_BODY="${{ github.event.pull_request.body }}"
            PR_HEAD="${{ github.event.pull_request.head.ref }}"
            PR_BASE="${{ github.event.pull_request.base.ref }}"
            PR_FILES="${{ github.event.pull_request.changed_files }}"
            PR_COMMITS="${{ github.event.pull_request.commits }}"
            PR_MERGED="${{ github.event.pull_request.merged }}"

            # 상태 문구
            if   [ "$PR_STATE" = "opened"   ]; then STATUS="🔔 새 PR이 열렸습니다!"
            elif [ "$PR_STATE" = "reopened" ]; then STATUS="♻️ PR이 다시 열렸습니다!"
            elif [ "$PR_STATE" = "closed"   ]; then
              if [ "$PR_MERGED" = "true" ]; then STATUS="✅ PR이 병합되었습니다!"
              else                                STATUS="❌ PR이 닫혔습니다!"
              fi
            else STATUS="ℹ️ PR 이벤트: $PR_STATE"
            fi

            [ -z "$PR_BODY" ] && PR_BODY="(내용 없음)"

            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d "{
                   \"username\": \"GitHub Bot\",
                   \"avatar_url\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\",
                   \"embeds\": [{
                     \"title\": \"📌 PR 제목: ${PR_TITLE}\",
                     \"url\": \"${PR_URL}\",
                     \"description\": \"${STATUS}\n👤 작성자: [${PR_USER}](https://github.com/${PR_USER})\",
                     \"color\": 5814783,
                     \"fields\": [
                       { \"name\": \"📂 브랜치\",           \"value\": \"\`${PR_HEAD}\` → \`${PR_BASE}\`\", \"inline\": true },
                       { \"name\": \"🧾 변경된 파일 수\", \"value\": \"${PR_FILES}개\",              \"inline\": true },
                       { \"name\": \"📝 커밋 수\",        \"value\": \"${PR_COMMITS}개\",           \"inline\": true },
                       { \"name\": \"💬 PR 내용\",        \"value\": \"${PR_BODY}\" }
                     ],
                     \"footer\": { \"text\": \"GitHub Actions - Pull Request 알림\" },
                     \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
                   }]
                 }" "$DISCORD_WEBHOOK"
          fi
