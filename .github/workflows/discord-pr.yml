name: Notify Discord on Push and Pull Request (Debug)

on:
  push:
    branches: [main, dev]           # ← main·dev 브랜치에 커밋 올 때
  pull_request:
    types: [opened, closed, reopened]
    branches: [main, dev]           # ← main·dev 대상으로 PR 열릴 때

jobs:
  discord-notify:
    runs-on: ubuntu-latest

    # ✅ 한 번만 선언 – 두 값 모두 필요
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      GITHUB_EVENT: ${{ toJson(github.event) }}

    steps:
      - name: Debug environment
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Webhook exists: ${{ secrets.DISCORD_WEBHOOK != '' }}"

      - name: Send Discord notification
        shell: bash
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_USER="${{ github.event.pull_request.user.login }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_STATE="${{ github.event.action }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          PR_HEAD="${{ github.event.pull_request.head.ref }}"
          PR_BASE="${{ github.event.pull_request.base.ref }}"
          PR_FILES="${{ github.event.pull_request.changed_files }}"
          PR_COMMITS="${{ github.event.pull_request.commits }}"
          PR_MERGED="${{ github.event.pull_request.merged }}"

          # 상태 메시지 정의
          case "$PR_STATE" in
            opened)
              STATUS="🔔 새 PR이 열렸습니다!"
              ;;
            closed)
              if $PR_MERGED; then
                STATUS="✅ PR이 병합되었습니다!"
              else
                STATUS="❌ PR이 닫혔습니다!"
              fi
              ;;
            reopened)
              STATUS="♻️ PR이 다시 열렸습니다!"
              ;;
            *)
              STATUS="ℹ️ PR 이벤트 발생: $PR_STATE"
              ;;
          esac

          # 본문이 없을 경우 대체 문구 설정
          if [ -z "$PR_BODY" ]; then
            PR_BODY="(내용 없음)"
          fi

          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{
            \"username\": \"GitHub Bot\",
            \"avatar_url\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\",
            \"embeds\": [{
              \"title\": \"📌 PR 제목: ${PR_TITLE}\",
              \"url\": \"${PR_URL}\",
              \"description\": \"${STATUS}\n👤 작성자: [${PR_USER}](https://github.com/${PR_USER})\",
              \"color\": 5814783,
              \"fields\": [
                {
                  \"name\": \"📂 브랜치\",
                  \"value\": \"\`${PR_HEAD}\` → \`${PR_BASE}\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"🧾 변경된 파일 수\",
                  \"value\": \"${PR_FILES}개\",
                  \"inline\": true
                },
                {
                  \"name\": \"📝 커밋 수\",
                  \"value\": \"${PR_COMMITS}개\",
                  \"inline\": true
                },
                {
                  \"name\": \"💬 PR 내용\",
                  \"value\": \"${PR_BODY}\"
                }
              ],
              \"footer\": {
                \"text\": \"GitHub Actions - dev 브랜치 PR 알림\"
              },
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" $DISCORD_WEBHOOK