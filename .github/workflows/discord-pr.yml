name: Notify Discord on Push and Pull Request

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, closed, reopened]
    branches: [main, dev]

jobs:
  discord-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          EVENT_NAME="${{ github.event_name }}"

          if [ "$EVENT_NAME" = "push" ]; then
            # 🟢 Push 이벤트 처리
            COMMIT_MESSAGE="${{ github.head_commit.message }}"
            COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
            COMMIT_AUTHOR="${{ github.head_commit.author.name }}"
            BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's|refs/heads/||')

            curl -H "Content-Type: application/json" \
            -X POST \
            -d "{
              \"username\": \"GitHub Bot\",
              \"avatar_url\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\",
              \"embeds\": [{
                \"title\": \"📦 커밋 푸시 알림: ${BRANCH_NAME}\",
                \"description\": \"💬 ${COMMIT_MESSAGE}\n👤 ${COMMIT_AUTHOR}\",
                \"url\": \"${COMMIT_URL}\",
                \"color\": 3447003,
                \"footer\": { \"text\": \"GitHub Actions - Push 이벤트\" },
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" $DISCORD_WEBHOOK

          elif [ "$EVENT_NAME" = "pull_request" ]; then
            # 🟡 PR 이벤트 처리
            PR_TITLE="${{ github.event.pull_request.title }}"
            PR_USER="${{ github.event.pull_request.user.login }}"
            PR_URL="${{ github.event.pull_request.html_url }}"
            PR_STATE="${{ github.event.action }}"
            PR_BODY="${{ github.event.pull_request.body }}"
            PR_HEAD="${{ github.event.pull_request.head.ref }}"
            PR_BASE="${{ github.event.pull_request.base.ref }}"
            PR_FILES="${{ github.event.pull_request.changed_files }}"
            PR_COMMITS="${{ github.event.pull_request.commits }}"
            PR_MERGED="${{ github.event.pull_request.merged }}"

            if [ "$PR_STATE" = "opened" ]; then
              STATUS="🔔 새 PR이 열렸습니다!"
            elif [ "$PR_STATE" = "reopened" ]; then
              STATUS="♻️ PR이 다시 열렸습니다!"
            elif [ "$PR_STATE" = "closed" ]; then
              if [ "$PR_MERGED" = "true" ]; then
                STATUS="✅ PR이 병합되었습니다!"
              else
                STATUS="❌ PR이 닫혔습니다!"
              fi
            else
              STATUS="ℹ️ PR 이벤트: $PR_STATE"
            fi

            if [ -z "$PR_BODY" ]; then
              PR_BODY="(내용 없음)"
            fi

            curl -H "Content-Type: application/json" \
            -X POST \
            -d "{
              \"username\": \"GitHub Bot\",
              \"avatar_url\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\",
              \"embeds\": [{
                \"title\": \"📌 PR 제목: ${PR_TITLE}\",
                \"url\": \"${PR_URL}\",
                \"description\": \"${STATUS}\n👤 작성자: [${PR_USER}](https://github.com/${PR_USER})\",
                \"color\": 5814783,
                \"fields\": [
                  {
                    \"name\": \"📂 브랜치\",
                    \"value\": \"\`${PR_HEAD}\` → \`${PR_BASE}\`\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"🧾 변경된 파일 수\",
                    \"value\": \"${PR_FILES}개\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"📝 커밋 수\",
                    \"value\": \"${PR_COMMITS}개\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"💬 PR 내용\",
                    \"value\": \"${PR_BODY}\"
                  }
                ],
                \"footer\": {
                  \"text\": \"GitHub Actions - Pull Request 알림\"
                },
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" $DISCORD_WEBHOOK
          fi