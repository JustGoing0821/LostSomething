name: Basic Discord Notification

on:
  workflow_dispatch:  # 수동 트리거 유지
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, closed, reopened]
    branches: [main, dev]

jobs:
  discord-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send simple notification
        run: |
          EVENT="${{ github.event_name }}"
          REPO="${{ github.repository }}"
          
          if [ "$EVENT" = "push" ]; then
            BRANCH="${{ github.ref_name }}"
            MESSAGE="📦 [Push 알림] \`$BRANCH\` 브랜치에 새 커밋이 푸시되었습니다."
          
          elif [ "$EVENT" = "pull_request" ]; then
            PR_ACTION="${{ github.event.action }}"
            PR_TITLE="${{ github.event.pull_request.title }}"
            PR_URL="${{ github.event.pull_request.html_url }}"
            
            if [ "$PR_ACTION" = "opened" ]; then
              STATUS="🔔 새 PR이 열렸습니다"
            elif [ "$PR_ACTION" = "reopened" ]; then
              STATUS="♻️ PR이 다시 열렸습니다"
            elif [ "$PR_ACTION" = "closed" ]; then
              if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
                STATUS="✅ PR이 병합되었습니다"
              else
                STATUS="❌ PR이 닫혔습니다"
              fi
            else
              STATUS="ℹ️ PR 이벤트: $PR_ACTION"
            fi
            
            MESSAGE="📌 [PR 알림] $STATUS - $PR_TITLE - $PR_URL"
          
          else
            MESSAGE="🔔 GitHub 알림: $EVENT 이벤트가 발생했습니다."
          fi
          
          # 단순 텍스트 메시지 전송
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"$MESSAGE\"}" \
            ${{ secrets.DISCORD_WEBHOOK }}